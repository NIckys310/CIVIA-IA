[project]
name = "civia-ai"
version = "0.1.0"
description = "CIVIA AI — capa de IA: visión, OCR, RAG con citas y orquestación del LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civia_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # tildes y símbolos (Ø, ×) son válidos en textos es-CO

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["civia_ai"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
